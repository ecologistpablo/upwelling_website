project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - what-we-offer.qmd
    - eligibility.qmd
    - application.qmd
    - contact.qmd
    - history.qmd
    - privacy.qmd
    - 404.qmd
  resources:
    - images/  # background photos referenced via inline-style url() aren't auto-detected
    - logo.svg
    - CNAME    # keeps the custom domain set when Actions republishes the site

website:
  title: "The Upwelling Project"
  site-url: https://upwellingproject.org
  google-analytics:
    tracking-id: "G-3CN2T57C1X"
    anonymize-ip: true
  cookie-consent:
    type: express
    style: simple
    palette: light
    policy-url: privacy.qmd
  favicon: favicon.svg
  navbar:
    logo: logo.svg
    logo-alt: "The Upwelling Project"
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: what-we-offer.qmd
        text: What we offer
      - href: eligibility.qmd
        text: Eligibility & how to apply
      - href: history.qmd
        text: History
      - href: contact.qmd
        text: Contact
  page-footer:
    border: false

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    include-after-body: footer.html
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
